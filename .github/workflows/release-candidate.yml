name: Release candidate checks
on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: ["fix/combined-portal-production"]
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_COMMON_PORTAL: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.1"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r deploy/requirements.txt reportlab==4.4.9
      - name: Production boundaries and release controls
        run: python -m unittest deploy.test_production -v
      - name: Accounts, workbooks, allocations and CN regression
        env:
          PYTHONPATH: cn/backend:cn/tests
        run: python -m unittest discover -s cn/tests -v
      - name: Preserved financial regression (private fixtures reported as skips)
        run: python integration/run_available_financial_tests.py
      - name: Compact installation controls
        run: python integration/test_compact_runtime.py
      - run: npm ci --ignore-scripts
      - name: Registration and approved seller visibility
        run: node --import tsx --test tests/seller-search-pilot.test.mjs tests/registration-errors.test.mjs
      - name: Combined production build and TypeScript
        run: npm run build
      - name: Allocation UI functions
        run: |
          node cn/tests/test_allocation_graph_update.cjs
          node cn/tests/test_workflow_ui.cjs
      - name: Browser acceptance
        run: |
          npx playwright install --with-deps chromium
          CN_BROWSER_TEST=browser_period_update.cjs python cn/tests/run_phase6_browser_flow.py
